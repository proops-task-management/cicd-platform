name: "SonarCloud Scan"
description: "Run SonarCloud analysis (reads sonar-project.properties from repo root; expects coverage/ present)"

# Composite action — wraps Day 26's SonarCloud step so every service inherits the
# quality gate by upgrading the platform. Composites have no `secrets` context, so
# the token comes in as an input value (the reusable workflow forwards secrets.SONAR_TOKEN).

inputs:
  sonar-token:
    description: "SonarCloud token"
    required: true
  sonar-host-url:
    description: "Sonar host URL"
    required: false
    default: "https://sonarcloud.io"
  qualitygate-wait:
    description: >
      "true"  = wait for the quality gate and FAIL the job if it fails — the BLOCKING
                PR gate (reusable-*-ci): sonar job fails → ci-success fails → merge blocked.
      "false" = fire-and-forget — the NON-BLOCKING main-branch baseline refresh
                (reusable-build, post-merge): updates the main dashboard + the New Code
                reference baseline, but a gate result never fails the build.
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: SonarCloud Scan
      uses: SonarSource/sonarqube-scan-action@v4
      with:
        args: >
          -Dsonar.qualitygate.wait=${{ inputs.qualitygate-wait }}
      env:
        SONAR_TOKEN: ${{ inputs.sonar-token }}
        SONAR_HOST_URL: ${{ inputs.sonar-host-url }}
