name: "Gitleaks Scan"
description: "Scan the working tree for committed secrets with the gitleaks binary (no license, org-safe)"

# Composite action — runs the gitleaks BINARY directly, not gitleaks/gitleaks-action@v2
# (that action requires a paid GITLEAKS_LICENSE for ORGANIZATION accounts since 2023).
# The binary is Apache-2.0 and free for any repo. Version pinned to match the pre-commit
# hook rev (.pre-commit-config.yaml) so local and CI catch the same things.

inputs:
  version:
    description: "gitleaks version (keep in sync with the pre-commit hook rev)"
    required: false
    default: "8.18.4"

runs:
  using: "composite"
  steps:
    - name: Install + run gitleaks (org-safe, no GITLEAKS_LICENSE)
      shell: bash
      run: |
        set -euo pipefail
        VER="${{ inputs.version }}"
        curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
          | tar -xz gitleaks
        # --no-git: scan the checked-out tree as-is (robust on shallow PR checkouts);
        # --exit-code 1: fail the job on a finding.
        #
        # -v and --redact are a PAIR and neither is optional (MIN-64):
        #   --redact  hides the secret VALUE    -> a red build never becomes a wider leak.
        #   -v        prints the LOCATION       -> File, Line, RuleID, Fingerprint.
        # These are separable properties, not a trade-off. gitleaks prints the location
        # NEXT TO a REDACTED value, so one run satisfies both. Without -v the entire
        # operator-facing output is "WRN leaks found: N" — which file, which line and
        # which rule are all withheld at the moment they matter most, because a committed
        # credential's blast radius grows until it is found and rotated. That silence cost
        # ~25 min across the only two real firings on record (TSG-010, 2 occurrences).
        # Do NOT drop -v to shorten logs. Do NOT drop --redact to "see the secret".
        #
        # Deliberately NO --report-path: a report artifact is a new distribution surface
        # for secret material and carries nothing the log does not already give. Decided
        # 2026-08-12 (MIN-64); rationale in IRD-021 §gitleaks output contract.
        ./gitleaks detect --source . --no-git --redact -v --exit-code 1 --no-banner
