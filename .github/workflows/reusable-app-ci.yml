name: Reusable App CI

# Reusable workflow (v4) — production-grade: parallel jobs gated by an aggregate
# `ci-success` job. Service callers require ONLY `app-ci / ci-success` in their
# ruleset, so the platform can add/remove internal jobs without any service editing
# its ruleset. Composites referenced by ABSOLUTE @v4 path (./ 404s when called externally).
# v4: image built linux/amd64 only (k3s nodes are amd64; dropped arm64-under-QEMU).

on:
  workflow_call:
    inputs:
      runtime-version:
        description: "Node.js version"
        type: string
        default: "20"
      image-tag:
        description: "Docker image tag (use the commit SHA)"
        type: string
        required: true
      push-image:
        description: "Push image to registry (true on merge, false on PR)"
        type: boolean
        default: false
      working-directory:
        type: string
        default: "."
      enable-sonar:
        description: "Run the SonarCloud quality gate (requires SONAR_TOKEN secret)"
        type: boolean
        default: false
    secrets:
      REGISTRY_USERNAME:
        required: false
      REGISTRY_TOKEN:
        required: false
      SONAR_TOKEN:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Platform banner (v5)
        run: echo "▶ cicd-platform reusable-app-ci @v5 — new propagated step (Day 40 S6)"
      - name: Build app (lint + test + build)
        uses: proops-task-management/cicd-platform/.github/actions/build-app@v4
        with:
          node-version: ${{ inputs.runtime-version }}
          working-directory: ${{ inputs.working-directory }}
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: ${{ inputs.working-directory }}/coverage/
          if-no-files-found: ignore

  sonar:
    needs: build
    if: ${{ inputs.enable-sonar }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so SonarCloud can compute "new code" (Day 26 lesson).
          fetch-depth: 0
      - name: Download coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage/
      - name: SonarCloud scan
        uses: proops-task-management/cicd-platform/.github/actions/sonar-scan@v4
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}

  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Docker build + push (linux/amd64 GHCR)
        uses: proops-task-management/cicd-platform/.github/actions/docker-build-push@v4
        with:
          registry: ghcr.io
          image-name: ${{ github.repository }}
          image-tag: ${{ inputs.image-tag }}
          push: ${{ inputs.push-image }}
          registry-username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          registry-password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

  # Aggregate gate — the ONLY required check in the service ruleset. Add/remove
  # jobs above without ever touching the ruleset again. `if: always()` so it runs
  # even when an upstream job failed; a `skipped` sonar (disabled) is not a failure.
  ci-success:
    needs: [build, sonar, image]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "build=${{ needs.build.result }} sonar=${{ needs.sonar.result }} image=${{ needs.image.result }}"
          echo "A required job did not succeed."
          exit 1
      - name: All required jobs passed
        run: echo "build=${{ needs.build.result }} sonar=${{ needs.sonar.result }} image=${{ needs.image.result }} — OK"
