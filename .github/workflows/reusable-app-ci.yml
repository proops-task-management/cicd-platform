name: Reusable App CI

# Reusable workflow — job-level reuse. Called by service repos via:
#   uses: proops-task-management/cicd-platform/.github/workflows/reusable-app-ci.yml@v1
# Composite actions are referenced by ABSOLUTE path (not ./) because when this
# workflow runs from a caller repo, checkout pulls the CALLER's code, so a
# relative ./ path would 404. Pin the composites to the same tag as the workflow.

on:
  workflow_call:
    inputs:
      runtime-version:
        description: "Node.js version"
        type: string
        default: "20"
      image-tag:
        description: "Docker image tag (use the commit SHA)"
        type: string
        required: true
      push-image:
        description: "Push image to registry (true on merge, false on PR)"
        type: boolean
        default: false
      working-directory:
        description: "Where the app lives in the service repo"
        type: string
        default: "."
    secrets:
      REGISTRY_USERNAME:
        required: false
      REGISTRY_TOKEN:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v4

      - name: Build app (lint + test + build)
        uses: proops-task-management/cicd-platform/.github/actions/build-app@v1
        with:
          node-version: ${{ inputs.runtime-version }}
          working-directory: ${{ inputs.working-directory }}

      - name: Docker build + push (multi-arch GHCR)
        uses: proops-task-management/cicd-platform/.github/actions/docker-build-push@v1
        with:
          registry: ghcr.io
          # GHCR image must live under the caller's owner namespace for GITHUB_TOKEN to push.
          image-name: ${{ github.repository }}
          image-tag: ${{ inputs.image-tag }}
          push: ${{ inputs.push-image }}
          # Good defaults: fall back to the auto GITHUB_TOKEN (works for GHCR) if the
          # caller didn't configure explicit registry secrets.
          registry-username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          registry-password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}
