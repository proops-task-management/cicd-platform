name: Reusable IaC (v6)

# Reusable workflow (v6) — the Terraform engine for iac-platform. Called by thin callers:
#   uses: proops-task-management/cicd-platform/.github/workflows/reusable-iac.yml@v6
# One workflow drives plan / apply / destroy via the `action` input. Auth is GitHub->AWS
# OIDC only (NO stored AWS keys — IRD-015 §OIDC / DOP-015 AC-11-10): plan assumes the
# read-only `gha-iac-plan` role, apply/destroy assume `gha-iac-apply`. On a PR it runs
# fmt-check + tflint + `plan` and posts the plan as a PR comment (IRD-016 §IaC pipelines).
#
# Callers MUST grant the job:  permissions: { id-token: write, contents: read, pull-requests: write }
# (a reusable workflow's effective permissions are capped by the caller's grant).
#
# Terraform variables reach this workflow ONLY through the optional `tf-vars` secret
# (multi-line KEY=value -> TF_VAR_<key>) — *.tfvars is gitignored and a reusable workflow
# does not inherit the caller's env, so there is no other channel (MIN-58).

on:
  workflow_call:
    inputs:
      action:
        description: "plan | apply | destroy"
        type: string
        required: true
      working-directory:
        description: "Terraform root config directory (e.g. envs/k3s-dev)"
        type: string
        required: true
      aws-role-arn:
        description: "OIDC role ARN — gha-iac-plan for plan, gha-iac-apply for apply/destroy"
        type: string
        required: true
      aws-region:
        type: string
        default: "ap-southeast-1"
      terraform-version:
        description: "Pinned Terraform version (IRD-013: >= 1.7, < 2.0)"
        type: string
        default: "1.9.8"
    secrets:
      tf-vars:
        description: >-
          Optional multi-line `KEY=value`. Each line is exported as TF_VAR_<key> for
          plan/apply/destroy. Deliberately GENERIC — the caller owns the variable NAME,
          this workflow only transports it (MIN-58).
        required: false

permissions:
  id-token: write         # request the OIDC token to assume the gha-iac-* role
  contents: read          # checkout
  pull-requests: write    # post the plan as a PR comment

jobs:
  iac:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repo
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ inputs.terraform-version }}

      # --- Terraform variable channel (MIN-58) -------------------------------
      # The caller may pass a multi-line `KEY=value` secret; each line becomes
      # TF_VAR_<key> for every terraform step below.
      #
      # WHY A SECRET, NOT AN INPUT: workflow inputs are echoed in the run header and
      # are never masked. The first consumer is `admin_cidr` (the operator /32 allowed
      # on the k3s API) — not a credential, but it must not be printed.
      #
      # WHY GENERIC, NOT `admin-cidr`: this workflow is the shared platform engine for
      # every Terraform root in every caller repo. A k3s-specific concept must not leak
      # into the platform contract, so the CALLER composes the variable name and this
      # workflow only transports it (IRD-015 §reusable-iac.yml).
      #
      # WHY THE EXPLICIT ::add-mask::  GitHub auto-masks only the EXACT string it was
      # handed — here the whole `admin_cidr=1.2.3.4/32` line. What Terraform then prints
      # into plan.txt and the PR comment is the BARE value, a different string the
      # automatic mask does not cover. Masking each parsed value is what actually hides it.
      #
      # WHY IT IS SAFE TO PASS THE SAME SECRET TO EVERY ROOT: a root that does not declare
      # a variable simply IGNORES its TF_VAR_ (unlike `-var`, which errors, or a .tfvars
      # file, which warns). Callers therefore pass it uniformly rather than per-root —
      # which `iac-manual` must do anyway, since it picks its root from a runtime input.
      #
      # NOTE: the `secrets` context is NOT available in a step-level `if:`, so the
      # emptiness check lives inside the script, not as a step condition.
      - name: Export tf-vars as TF_VAR_*
        env:
          TF_VARS: ${{ secrets.tf-vars }}
        run: |
          set -euo pipefail
          if [ -z "${TF_VARS:-}" ]; then
            echo "No tf-vars secret supplied — variables come from defaults / terraform.tfvars only."
            exit 0
          fi
          n=0
          while IFS= read -r raw || [ -n "$raw" ]; do
            n=$((n + 1))
            line="${raw%$'\r'}"                       # tolerate CRLF-pasted secrets
            case "$line" in ''|'#'*) continue ;; esac  # blank + comment lines
            key="${line%%=*}"                          # split on the FIRST '=' only, so
            val="${line#*=}"                           # a value may itself contain '='
            if [ "$key" = "$line" ]; then
              echo "::error::tf-vars line $n is not in KEY=value form"; exit 1
            fi
            # Never echo the key on failure — a malformed line may BE the value.
            if ! printf '%s' "$key" | grep -Eq '^[A-Za-z_][A-Za-z0-9_]*$'; then
              echo "::error::tf-vars line $n has an invalid Terraform variable name"; exit 1
            fi
            echo "::add-mask::${val}"                  # mask BEFORE it can reach any log
            {
              echo "TF_VAR_${key}<<__TFVARS_EOF__"     # heredoc form: a value containing a
              echo "${val}"                            # newline cannot inject a second var
              echo "__TFVARS_EOF__"
            } >> "$GITHUB_ENV"
            echo "exported TF_VAR_${key}"              # log the NAME only, never the value
          done <<< "$TF_VARS"

      # fmt-check gates on style before anything touches AWS (IRD-013). Recursive so a
      # module change in a sibling dir is caught even when only a root is planned.
      - name: Terraform fmt (check)
        run: terraform fmt -check -recursive

      # OIDC: short-lived credentials by assuming the scoped role. No secrets in the repo.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ inputs.aws-role-arn }}
          aws-region: ${{ inputs.aws-region }}
          role-session-name: gha-iac-${{ inputs.action }}-${{ github.run_id }}

      - name: Init
        working-directory: ${{ inputs.working-directory }}
        run: terraform init

      - name: Validate
        working-directory: ${{ inputs.working-directory }}
        run: terraform validate

      - name: Setup TFLint
        if: inputs.action != 'destroy'
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.53.0

      - name: TFLint
        if: inputs.action != 'destroy'
        working-directory: ${{ inputs.working-directory }}
        run: |
          tflint --init
          tflint --chdir=. --recursive

      # plan for both plan and apply actions. `-lock=false`: the read-only gha-iac-plan role
      # has ReadOnlyAccess and cannot take the DynamoDB state lock; apply below keeps the lock
      # (gha-iac-apply is RW). Safe because CI plan is a single, non-mutating run.
      - name: Plan
        id: plan
        if: inputs.action == 'plan' || inputs.action == 'apply'
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          LOCK_FLAG=""
          [ "${{ inputs.action }}" = "plan" ] && LOCK_FLAG="-lock=false"
          terraform plan -no-color -input=false $LOCK_FLAG -out=tfplan
          terraform show -no-color tfplan > plan.txt

      - name: Upload plan artifact
        if: inputs.action == 'plan'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.run_id }}
          path: |
            ${{ inputs.working-directory }}/tfplan
            ${{ inputs.working-directory }}/plan.txt
          retention-days: 5

      # Post the plan on the PR so review happens in the PR, and /review-plan (Agent C) has a
      # plan to fetch. Truncated to stay under GitHub's 65 536-char comment limit.
      - name: Comment plan on PR
        if: inputs.action == 'plan' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          ROOT: ${{ inputs.working-directory }}
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          { echo "### \`terraform plan\` — \`$ROOT\`"; echo; echo '<details><summary>Show plan</summary>'; echo; echo '```terraform'; head -c 60000 plan.txt; echo; echo '```'; echo '</details>'; echo; echo "_Review with \`/review-plan\` (Agent C, advisory) before merge._"; } > comment.md
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file comment.md

      - name: Apply
        if: inputs.action == 'apply'
        working-directory: ${{ inputs.working-directory }}
        run: terraform apply -no-color -input=false -auto-approve tfplan

      - name: Destroy
        if: inputs.action == 'destroy'
        working-directory: ${{ inputs.working-directory }}
        run: terraform destroy -no-color -input=false -auto-approve
