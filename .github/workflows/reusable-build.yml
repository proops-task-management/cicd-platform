name: Reusable Build

# Reusable workflow (v4) — the "build once" half of the Day 29 promotion model.
# Runs lint + test + build, then builds a linux/amd64 image tagged by the commit
# SHA and pushes it to GHCR ONE time (amd64-only: k3s nodes are amd64; Day 35
# dropped the fragile arm64-under-QEMU leg). The SHA is surfaced to the caller via
# the workflow-level `outputs.image-tag` so every environment can promote the SAME
# bytes. Composites are referenced by ABSOLUTE @v4 path (./ 404s when called
# externally), consistent with reusable-app-ci.yml.

on:
  workflow_call:
    inputs:
      runtime-version:
        description: "Node.js version"
        type: string
        default: "20"
      working-directory:
        type: string
        default: "."
      project-name:
        description: "GHCR namespace / image owner (e.g. proops-task-management)"
        type: string
        required: true
      service-name:
        description: "Image name under the project (e.g. frontend-service)"
        type: string
        required: true
      enable-sonar:
        description: "Run the SonarCloud quality gate on the main branch (needs SONAR_TOKEN)"
        type: boolean
        default: false
    outputs:
      image-tag:
        description: "The commit SHA used as the image tag — promote this everywhere"
        # Workflow-level output: the ONLY way a value leaves a reusable workflow.
        # It points at the job-level output, which points at the step output.
        value: ${{ jobs.build.outputs.image-tag }}
    secrets:
      SONAR_TOKEN:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Job-level output: relays the step output up so the workflow output can read it.
    outputs:
      image-tag: ${{ steps.set-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Build app (lint + test + build)
        uses: proops-task-management/cicd-platform/.github/actions/build-app@v4
        with:
          node-version: ${{ inputs.runtime-version }}
          working-directory: ${{ inputs.working-directory }}

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: ${{ inputs.working-directory }}/coverage/
          if-no-files-found: ignore

      - id: set-tag
        name: Compute image tag from commit SHA
        # Step output: the single place the SHA is computed. Everything else
        # references steps.set-tag.outputs.tag so there is one source of truth.
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Docker build + push (linux/amd64 GHCR)
        uses: proops-task-management/cicd-platform/.github/actions/docker-build-push@v4
        with:
          registry: ghcr.io
          image-name: ${{ inputs.project-name }}/${{ inputs.service-name }}
          image-tag: ${{ steps.set-tag.outputs.tag }}
          push: "true"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Record SHA in run summary
        run: |
          {
            echo "### Build complete — promote this SHA"
            echo "Image tag: \`${{ steps.set-tag.outputs.tag }}\`"
            echo "Image: \`ghcr.io/${{ inputs.project-name }}/${{ inputs.service-name }}:${{ steps.set-tag.outputs.tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Optional main-branch SonarCloud analysis (parallel to the image push, gated by
  # enable-sonar). Keeps the SonarCloud "new code" baseline fresh after each merge.
  # deploy jobs that `needs: build` (the caller's reusable-build call) wait for this
  # too, so a failed main-branch gate blocks the dev deploy.
  sonar:
    needs: build
    if: ${{ inputs.enable-sonar }}
    # Non-blocking: main-branch analysis refreshes the baseline + catches bypass
    # pushes, but a gate failure here does NOT fail the reusable-build call, so the
    # caller's deploy-dev (needs: build) still proceeds. Industry norm: PR blocks,
    # main monitors. The PR gate (reusable-app-ci on pr-opened) is the blocking one.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so SonarCloud computes "new code" (Day 26 lesson)
      - name: Download coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage/
      - name: SonarCloud scan
        uses: proops-task-management/cicd-platform/.github/actions/sonar-scan@v4
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}
