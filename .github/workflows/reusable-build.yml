name: Reusable Build

# Reusable workflow (v6) — the "build once" half. Runs the stack's test+build, builds a
# linux/amd64 image tagged by the commit SHA (Day-35: amd64-only in CI), pushes :sha + :latest
# to GHCR ONCE, trivy-image-gates it, then hands off to GitOps by bumping the deploy repo's
# dev overlay (bump-dev). The SHA is surfaced via workflow output so every env promotes the
# SAME bytes. Composites referenced by ABSOLUTE @v6 path (./ 404s when called externally).
#
# NOTE (v6): the v5 optional main-branch SonarCloud "refresh" job was dropped. The PR gate
# (reusable-*-ci) runs the BLOCKING Sonar scan; the ruleset guarantees main only advances via
# a green PR, so a non-blocking main-branch refresh added no enforcement. SonarCloud "new code"
# baseline is handled by setting New Code = reference branch `main` at Sonar project onboarding
# (D4/D6) — see TODO on MIN-8. IRD-015 build contract = build + bump-dev only.

on:
  workflow_call:
    inputs:
      project-name:
        description: "GHCR namespace / image owner (e.g. proops-task-management)"
        type: string
        required: true
      service-name:
        description: "Image name + deploy overlay key (e.g. task-service)"
        type: string
        required: true
      stack:
        description: "node | java — selects build-app or build-java"
        type: string
        required: true
      runtime-version:
        description: "Node.js version (stack=node)"
        type: string
        default: "20"
      java-version:
        description: "Temurin version (stack=java)"
        type: string
        default: "21"
      working-directory:
        type: string
        default: "."
      run-integration-tests:
        description: "stack=java: run Testcontainers *IT (mvn verify)"
        type: boolean
        default: true
      push-ecr-mirror:
        description: "Also mirror the image to ECR — EKS window only (IRD-023). Wired in Phase 9."
        type: boolean
        default: false
    outputs:
      image-tag:
        description: "The commit SHA used as the image tag — promote this everywhere"
        value: ${{ jobs.build.outputs.image-tag }}
    secrets:
      DEPLOY_REPO_TOKEN:
        description: "Fine-grained token / App creds, scope = deploy repo contents:write ONLY. Absent before D12 → bump-dev self-skips."
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write          # trivy image SARIF upload
    outputs:
      image-tag: ${{ steps.set-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Build + test (Node)
        if: ${{ inputs.stack == 'node' }}
        uses: proops-task-management/cicd-platform/.github/actions/build-app@v6
        with:
          node-version: ${{ inputs.runtime-version }}
          working-directory: ${{ inputs.working-directory }}

      - name: Build + test (Java)
        if: ${{ inputs.stack == 'java' }}
        uses: proops-task-management/cicd-platform/.github/actions/build-java@v6
        with:
          java-version: ${{ inputs.java-version }}
          working-directory: ${{ inputs.working-directory }}
          run-integration-tests: ${{ inputs.run-integration-tests }}

      - id: set-tag
        name: Compute image tag from commit SHA
        run: echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Docker build + push (:sha + :latest, linux/amd64 GHCR)
        uses: proops-task-management/cicd-platform/.github/actions/docker-build-push@v6
        with:
          registry: ghcr.io
          image-name: ${{ inputs.project-name }}/${{ inputs.service-name }}
          image-tag: ${{ steps.set-tag.outputs.tag }}
          push: "true"
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy image scan (gate before the SHA is trusted for deploy)
        # Image is in GHCR now, but nothing DEPLOYS it until bump-dev (needs: build).
        # A failed gate fails build → bump-dev never runs → the vulnerable SHA is never
        # referenced by any env. "Trust" = referenced by deploy, not mere existence.
        uses: proops-task-management/cicd-platform/.github/actions/trivy-scan@v6
        with:
          scan-type: image
          scan-ref: ghcr.io/${{ inputs.project-name }}/${{ inputs.service-name }}:${{ steps.set-tag.outputs.tag }}
          scanners: vuln
          sarif-category: trivy-image

      - name: Record SHA in run summary
        run: |
          {
            echo "### Build complete — promote this SHA"
            echo "Image: \`ghcr.io/${{ inputs.project-name }}/${{ inputs.service-name }}:${{ steps.set-tag.outputs.tag }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # GitOps handoff — CI's last act. Bumps the deploy repo dev overlay to the new SHA.
  # Self-skips cleanly until the deploy repo + DEPLOY_REPO_TOKEN exist (D12), so the
  # D3 canary is green. Idempotent: commits only if the SHA actually changed.
  bump-dev:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - id: guard
        name: Is the GitOps handoff configured yet?
        env:
          TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "DEPLOY_REPO_TOKEN not set — GitOps bump skipped (expected before D12)."
          fi

      - name: Checkout deploy repo
        if: ${{ steps.guard.outputs.enabled == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.project-name }}/deploy
          token: ${{ secrets.DEPLOY_REPO_TOKEN }}
          path: deploy

      - name: Install kustomize
        if: ${{ steps.guard.outputs.enabled == 'true' }}
        run: |
          curl -sSfL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" \
            | bash -s 5.4.3
          sudo mv kustomize /usr/local/bin/

      - name: Bump dev overlay to the new SHA (idempotent, retry once on race)
        if: ${{ steps.guard.outputs.enabled == 'true' }}
        working-directory: deploy/apps/${{ inputs.service-name }}/overlays/dev
        env:
          IMG: ghcr.io/${{ inputs.project-name }}/${{ inputs.service-name }}
          SHA: ${{ needs.build.outputs.image-tag }}
        run: |
          set -euo pipefail
          git config user.name  "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          kustomize edit set image "${{ inputs.service-name }}=${IMG}:${SHA}"
          if git -C "$GITHUB_WORKSPACE/deploy" diff --quiet; then
            echo "dev overlay already at ${SHA} — nothing to commit (idempotent)."
            exit 0
          fi
          git -C "$GITHUB_WORKSPACE/deploy" add -A
          git -C "$GITHUB_WORKSPACE/deploy" commit -m "ci(${{ inputs.service-name }}): dev → ${SHA}"
          # Retry once: a concurrent service build may have pushed between our fetch and push.
          for attempt in 1 2; do
            if git -C "$GITHUB_WORKSPACE/deploy" push; then
              echo "pushed on attempt ${attempt}"; exit 0
            fi
            echo "push rejected (non-fast-forward) — rebasing and retrying"
            git -C "$GITHUB_WORKSPACE/deploy" pull --rebase
          done
          echo "bump-dev failed after retry"; exit 1
