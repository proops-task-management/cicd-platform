name: Reusable Node CI

# Reusable workflow (v6) — Node PR gate (the Node twin of reusable-java-ci). Parallel jobs
# gated by an aggregate `ci-success` job; service callers require ONLY `app-ci / ci-success`
# (the aggregate check name comes from the caller JOB id `app-ci`, not this filename — so this
# rename does not touch any ruleset). v6 adds the gitleaks + trivy-fs security gates (IRD-021)
# and bumps internal composite refs @v4 → @v6 so the whole tag is self-consistent.
# Composites referenced by ABSOLUTE @v6 path (./ 404s when called externally).

on:
  workflow_call:
    inputs:
      runtime-version:
        description: "Node.js version"
        type: string
        default: "20"
      image-tag:
        description: "Docker image tag (use the commit SHA)"
        type: string
        required: true
      push-image:
        description: "Push image to registry (true on merge, false on PR)"
        type: boolean
        default: false
      working-directory:
        type: string
        default: "."
      enable-sonar:
        description: "Run the SonarCloud quality gate (requires SONAR_TOKEN secret)"
        type: boolean
        default: false
    secrets:
      REGISTRY_USERNAME:
        required: false
      REGISTRY_TOKEN:
        required: false
      SONAR_TOKEN:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write          # NEW (v6): trivy SARIF upload → Security tab
    steps:
      - uses: actions/checkout@v4

      - name: Scan for committed secrets (gitleaks)   # NEW (v6) — IRD-021
        uses: proops-task-management/cicd-platform/.github/actions/gitleaks-scan@v6

      - name: Build app (lint + test + build)
        uses: proops-task-management/cicd-platform/.github/actions/build-node@v6
        with:
          node-version: ${{ inputs.runtime-version }}
          working-directory: ${{ inputs.working-directory }}

      - name: Trivy filesystem scan (deps + secrets + misconfig)   # NEW (v6) — IRD-021
        uses: proops-task-management/cicd-platform/.github/actions/trivy-scan@v6
        with:
          scan-type: fs
          scan-ref: ${{ inputs.working-directory }}
          sarif-category: trivy-fs
          skip-dirs: k8s,iac          # owned by Kyverno (admission) + IaC pipeline, not app-CI
          policy: warn                # third-party CVEs: report, don't block (ADR-012)

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: ${{ inputs.working-directory }}/coverage/
          if-no-files-found: ignore

  sonar:
    needs: build
    # Skip on Dependabot PRs: secrets are withheld from Dependabot runs (empty SONAR_TOKEN) and a
    # dep bump has no new first-party code to gate. A skipped sonar is not a failure for ci-success.
    if: ${{ inputs.enable-sonar && github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so SonarCloud can compute "new code" (Day 26 lesson).
          fetch-depth: 0
      - name: Download coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage/
      - name: SonarCloud scan
        uses: proops-task-management/cicd-platform/.github/actions/sonar-scan@v6
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}

  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Docker build + push (linux/amd64 GHCR)
        uses: proops-task-management/cicd-platform/.github/actions/docker-build-push@v6
        with:
          registry: ghcr.io
          image-name: ${{ github.repository }}
          image-tag: ${{ inputs.image-tag }}
          push: ${{ inputs.push-image }}
          registry-username: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          registry-password: ${{ secrets.REGISTRY_TOKEN || secrets.GITHUB_TOKEN }}

  # Aggregate gate — the ONLY required check in the service ruleset. Add/remove
  # jobs above without ever touching the ruleset again. `if: always()` so it runs
  # even when an upstream job failed; a `skipped` sonar (disabled) is not a failure.
  ci-success:
    needs: [build, sonar, image]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "build=${{ needs.build.result }} sonar=${{ needs.sonar.result }} image=${{ needs.image.result }}"
          echo "A required job did not succeed."
          exit 1
      - name: All required jobs passed
        run: echo "build=${{ needs.build.result }} sonar=${{ needs.sonar.result }} image=${{ needs.image.result }} — OK"
