name: Reusable Java CI

# Reusable workflow (v6) — the backend PR gate. The Java twin of reusable-node-ci.
# One `ci` job runs the full gate (build+test, gitleaks, trivy fs, sonar); a `ci-success`
# aggregate is the ONLY required status check in every service ruleset. Naming the caller
# job `app-ci` makes the check resolve to `app-ci / ci-success` — identical name across
# Node and Java repos, so one ruleset line covers all 5 services (IRD-015).
#
# INTENTIONAL asymmetry vs reusable-node-ci (do NOT "fix" into symmetry): Node splits
# build/sonar/image into 3 jobs because its sonar job needs the coverage artifact from a
# separate build job (jobs don't share a filesystem). Java keeps sonar as a STEP inside
# `ci` because the maven workspace already holds target/classes + jacoco — running sonar
# in-job avoids shipping a heavy `target/` artifact between jobs. Only `image` is a
# separate job (it re-builds via the Dockerfile, independent of the maven workspace).

on:
  workflow_call:
    inputs:
      service-name:
        description: "Service repo/image name, e.g. task-service"
        type: string
        required: true
      java-version:
        type: string
        default: "21"
      run-integration-tests:
        description: "Run Testcontainers *IT (mvn verify) vs unit-only (mvn test)"
        type: boolean
        default: true
      enable-sonar:
        description: "Run the SonarCloud quality gate (needs SONAR_TOKEN)"
        type: boolean
        default: true
    secrets:
      SONAR_TOKEN:
        required: false

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write      # trivy SARIF upload → Security tab
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so SonarCloud computes "new code" (Day 26)

      - name: Scan for committed secrets (gitleaks)
        uses: proops-task-management/cicd-platform/.github/actions/gitleaks-scan@v6

      - name: Build + test (mvn -B verify)
        uses: proops-task-management/cicd-platform/.github/actions/build-java@v6
        with:
          java-version: ${{ inputs.java-version }}
          run-integration-tests: ${{ inputs.run-integration-tests }}

      - name: Trivy filesystem scan (dependencies + secrets + misconfig)
        uses: proops-task-management/cicd-platform/.github/actions/trivy-scan@v6
        with:
          scan-type: fs
          scan-ref: "."
          sarif-category: trivy-fs
          skip-dirs: k8s,iac          # owned by Kyverno (admission) + IaC pipeline, not app-CI
          policy: warn                # third-party CVEs: report, don't block (ADR-012)

      # Skip Sonar on Dependabot PRs: GitHub withholds Actions secrets from Dependabot runs
      # (`Secret source: Dependabot` → empty SONAR_TOKEN → auth fail), AND a dep bump has zero
      # new first-party code for Sonar to gate. build+test still runs (the real gate for a bump);
      # Trivy still reports the dependency CVEs. Net: no security loss. (ADR-012 gate-purpose rule.)
      - name: SonarScanner for Maven
        if: ${{ inputs.enable-sonar && github.actor != 'dependabot[bot]' }}
        uses: proops-task-management/cicd-platform/.github/actions/sonar-scan-maven@v6
        with:
          sonar-token: ${{ secrets.SONAR_TOKEN }}

  # Build the container at PR time (push:false) so a broken Dockerfile / a base-image that
  # fails to compile (e.g. a JDK bump that breaks Lombok — MIN-8) is caught HERE, not post-merge.
  # Node already did this (reusable-node-ci `image` job); this brings Java to parity. The image
  # is loaded locally (docker-build-push `load`) then trivy-image scanned (warn — third-party
  # base CVEs report, don't block; ADR-012). NOT pushed — the real push is the merge build.
  image:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write      # trivy image SARIF upload → Security tab
    steps:
      - uses: actions/checkout@v4

      - name: Docker build (push:false, loaded locally) — proves the Dockerfile builds
        uses: proops-task-management/cicd-platform/.github/actions/docker-build-push@v6
        with:
          registry: ghcr.io
          image-name: ${{ github.repository }}
          image-tag: ${{ github.sha }}      # defaulted internally → the 4 Java callers don't change
          push: false

      - name: Trivy image scan (report — advisory, non-blocking)
        uses: proops-task-management/cicd-platform/.github/actions/trivy-scan@v6
        with:
          scan-type: image
          scan-ref: ghcr.io/${{ github.repository }}:${{ github.sha }}
          scanners: vuln
          sarif-category: trivy-image
          policy: warn                # base-layer CVEs are third-party — report, don't block

  # Aggregate gate — the ONLY required check in the service ruleset. Add/remove steps
  # or jobs without ever editing a ruleset. `if: always()` so a skipped/failed upstream
  # is evaluated explicitly rather than silently passing.
  ci-success:
    needs: [ci, image]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "ci=${{ needs.ci.result }} image=${{ needs.image.result }} — a required job did not succeed."
          exit 1
      - name: Gate passed
        run: echo "ci=${{ needs.ci.result }} image=${{ needs.image.result }} — OK"
