# Dependabot for cicd-platform (IRD-015 §Dependabot standard · MIN-41).
#
# WHY THIS FILE EXISTS: every other repo pins @v6 of THIS repo, so the action versions pinned
# here are inherited by all 6 consumers. With no bot here, nothing ever proposed a bump:
# sonarqube-scan-action@v4 (CVE-2025-58178) and 15 Node-20 actions sat untouched for two months
# after they were first flagged (MIN-40 → MIN-41). IRD-015 already required Dependabot in "all
# repos"; the one repo whose pins everyone inherits was the one without it.
#
# WHY TWO DIRECTORIES: "/" only covers .github/workflows/. Composite actions live in
# .github/actions/<name>/action.yml and are invisible to Dependabot unless listed explicitly.
#
# WHY MAJORS ARE NOT GROUPED: a major bump here reaches every consumer the moment @v6 moves, so
# each one is a deliberate, individually reviewed change (release notes read, v6.x cut).
#
# WHY THE MINOR/PATCH GROUP IS NOW LIVE (MIN-65): every third-party action is pinned to a full
# commit SHA with a trailing `# vX.Y.Z` comment. Under the old @vN major-tag pins a minor or patch
# release never produced a PR — the tag moved underneath us with no diff in this repo, which is
# exactly how a REPOINTED tag would also have arrived (tj-actions, trivy-action). Now every release
# is a reviewable diff: Dependabot bumps the SHA and the version comment together, batched weekly
# into one `all-minor-patch` PR (group name per IRD-015 §Dependabot standard).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    groups:
      all-minor-patch:
        update-types:
          - "minor"
          - "patch"
